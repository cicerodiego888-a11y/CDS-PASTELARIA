<div class="financeiro-page">
  <header class="financeiro-page-header">
    <div class="financeiro-page-heading">
      <span class="financeiro-page-eyebrow">GESTÃO FINANCEIRA</span>
      <h1>Financeiro</h1>
      <p>Contas a receber, pagar e visão geral do grupo de empresas.</p>
    </div>
    <div class="financeiro-header-actions cds-page-header__toolbar-host">
      <div class="financeiro-periodo-controls">
        <div class="financeiro-periodo-field financeiro-empresa-field">
          <label for="financeiroEmpresaSelect" class="form-label">Empresa</label>
          <div class="financeiro-select-com-icone">
            <i class="fas fa-building" aria-hidden="true"></i>
            <select id="financeiroEmpresaSelect" class="form-select" aria-label="Escopo empresarial financeiro">
              <option value="todas">Todas as empresas</option>
            </select>
          </div>
          <span id="financeiroEmpresaEstado" class="financeiro-empresa-estado" role="status" aria-live="polite" hidden></span>
        </div>
        <div class="financeiro-periodo-field financeiro-periodo-field--preset">
          <label for="financeiroPeriodo" class="form-label">Período</label>
          <div class="financeiro-select-com-icone">
            <i class="far fa-calendar-alt" aria-hidden="true"></i>
            <select id="financeiroPeriodo" class="form-select">
              <option value="hoje">Hoje</option>
              <option value="7dias">Últimos 7 dias</option>
              <option value="mes-atual">Mês atual</option>
              <option value="personalizado">Personalizado</option>
            </select>
          </div>
        </div>
        <div class="financeiro-periodo-field d-none" id="financeiroPeriodoInicioWrapper">
          <label for="financeiroDataInicio" class="form-label">Data inicial</label>
          <input type="date" id="financeiroDataInicio" class="form-control">
        </div>
        <div class="financeiro-periodo-field d-none" id="financeiroPeriodoFimWrapper">
          <label for="financeiroDataFim" class="form-label">Data final</label>
          <input type="date" id="financeiroDataFim" class="form-control">
        </div>
        <button type="button" id="btnAtualizarFinanceiro" class="btn btn-primary financeiro-btn-atualizar">
          <i class="fas fa-sync-alt" aria-hidden="true"></i> Atualizar
        </button>
      </div>
    </div>
  </header>

  <nav class="financeiro-tabs" aria-label="Seções do Financeiro">
    <button type="button" class="financeiro-tab active" data-aba="dashboard">Dashboard</button>
    <button type="button" class="financeiro-tab" data-aba="receber">Contas a Receber</button>
    <button type="button" class="financeiro-tab" data-aba="duplicata">Dívidas por Cliente</button>
    <button type="button" class="financeiro-tab" data-aba="pagar">Contas a Pagar</button>
    <button type="button" class="financeiro-tab" data-aba="condicoes">Condições de Pagamento</button>
    <button type="button" class="financeiro-tab" data-aba="historico">Histórico</button>
    <button type="button" class="financeiro-tab" data-aba="relatorios">Relatórios</button>
  </nav>

  <div id="financeiroConteudo" class="financeiro-conteudo">
    <!-- Conteúdo das abas será carregado aqui -->
  </div>

  <div class="modal fade" id="modalDetalhesFinanceiro" tabindex="-1" aria-labelledby="modalDetalhesFinanceiroLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalDetalhesFinanceiroLabel">Detalhes</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body" id="modalDetalhesFinanceiroBody">
          <div class="text-center text-muted">Carregando...</div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalPagamentoParcial" tabindex="-1" aria-labelledby="modalPagamentoParcialLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title" id="modalPagamentoParcialLabel">
            <i class="fas fa-money-bill-wave"></i> Pagamento Parcial
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <div id="modalPagamentoParcialClienteInfo" class="mb-3 p-3 bg-light rounded">
            <div class="text-muted small">Cliente:</div>
            <strong id="modalPagamentoParcialClienteNome">-</strong>
            <div class="text-muted small mt-2">Saldo em Aberto:</div>
            <strong id="modalPagamentoParcialSaldo" class="text-danger">R$ 0,00</strong>
          </div>

          <form id="formPagamentoParcial">
            <div class="mb-3">
              <label for="pagamentoParcialValor" class="form-label">Valor do Pagamento *</label>
              <div class="input-group">
                <span class="input-group-text">R$</span>
                <input 
                  type="number" 
                  id="pagamentoParcialValor" 
                  class="form-control" 
                  placeholder="0,00"
                  step="0.01"
                  min="0"
                  required
                >
              </div>
              <small class="text-muted">Use ponto como separador decimal (ex: 1.500,00 = 1500.00)</small>
            </div>

            <div class="mb-3">
              <label for="pagamentoParcialData" class="form-label">Data do Pagamento *</label>
              <input 
                type="date" 
                id="pagamentoParcialData" 
                class="form-control"
                required
              >
            </div>

            <div class="mb-3">
              <label for="pagamentoParcialForma" class="form-label">Forma de Pagamento</label>
              <select id="pagamentoParcialForma" class="form-select">
                <option value="dinheiro">Dinheiro</option>
                <option value="pix">PIX</option>
                <option value="cheque">Cheque</option>
                <option value="cartao_credito">Cartão de Crédito</option>
                <option value="cartao_debito">Cartão de Débito</option>
                <option value="transferencia">Transferência Bancária</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="pagamentoParcialObservacao" class="form-label">Observações (Opcional)</label>
              <textarea 
                id="pagamentoParcialObservacao" 
                class="form-control" 
                rows="2"
                placeholder="Adicione observações sobre este pagamento..."
              ></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="btnConfirmarPagamentoParcial">
            <i class="fas fa-check"></i> Confirmar Pagamento
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalConfirmacaoPagamentoParcial" tabindex="-1" aria-labelledby="modalConfirmacaoPagamentoParcialLabel" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-secondary text-white">
          <h5 class="modal-title" id="modalConfirmacaoPagamentoParcialLabel">
            <i class="fas fa-question-circle"></i> Confirmar pagamento
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <p id="confirmacaoPagamentoParcialTexto" class="mb-0"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Não</button>
          <button type="button" class="btn btn-primary" id="btnConfirmacaoPagamentoParcialSim">Sim</button>
        </div>
      </div>
    </div>
  </div>

<script src="js/financeiro-historico.js"></script>

<!-- Conteúdo do Financeiro carregado dinamicamente.
    Os scripts e estilos do módulo já são importados em index.html. -->
